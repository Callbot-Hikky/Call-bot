[project]
name = "hikky"
version = "0.1.0"
description = "Hikky — callbot vocal pour restaurants (dépôt IA)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]
voice = [
    "faster-whisper>=1.0",
    "llama-cpp-python>=0.2.79",
    "piper-tts>=1.2",
    # VAD d'endpointing téléphonique : découpe les tours de parole par
    # détection d'activité vocale plutôt que par énergie (mots tronqués).
    "webrtcvad>=2.0.10",
]
# XTTS-v2. Bornes strictes : coqui-tts exige transformers>=4.57, et
# transformers>=5 supprime des symboles qu'il utilise encore. Coqui
# n'ayant plus de mainteneur, cette fenetre ne se reparera pas seule.
# Licence CPML : usage non commercial uniquement.
xtts = [
    "coqui-tts>=0.27",
    "transformers>=4.57,<5",
    "torch>=2.5",
]
pipeline = [
    "pipecat-ai>=0.0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hikky"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
