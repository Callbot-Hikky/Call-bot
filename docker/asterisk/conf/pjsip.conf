; Configuration PJSIP minimale : un transport UDP + une extension 1000
; pour enregistrer Zoiper (ou tout autre softphone).
;
; Mot de passe de l'extension : configurable via la variable d'env
; SIP_EXTENSION_PASSWORD (défaut = "1000" — À CHANGER en démo publique).

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Pas de NAT ici : on suppose que Zoiper est sur le même réseau que le
; container (typiquement ton Mac, via Docker Desktop). Si tu ouvres la
; démo depuis l'extérieur, ajoute `external_media_address` +
; `external_signaling_address` avec l'IP publique.

; ─────────────────────── Extension 1000 (softphone démo) ───────────────────────

[1000]
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw,g722
auth=1000
aors=1000
direct_media=no
; Softphone joignant Asterisk depuis internet, derrière le NAT de sa box :
; force_rport + rewrite_contact réécrivent l'adresse de signalisation vue
; réellement (au lieu de l'IP privée annoncée par le client), et
; rtp_symmetric renvoie le RTP vers l'adresse d'où il arrive. Sans ça, la
; signalisation marche mais l'audio part dans le vide (silence unidirectionnel).
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[1000]
type=auth
auth_type=userpass
username=1000
password=__SIP_EXTENSION_PASSWORD__

[1000]
type=aor
max_contacts=1
qualify_frequency=30
; Un softphone derrière NAT se réenregistre depuis un port source qui change.
; Sans ceci, l'ancien contact (pas encore expiré) sature max_contacts=1 et
; Asterisk rejette le nouveau REGISTER — le softphone affiche « mauvais mot de
; passe » alors que l'auth est bonne. remove_existing évince le contact obsolète
; pour que le dernier enregistrement gagne toujours.
remove_existing=yes
