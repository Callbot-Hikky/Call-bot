; On charge automatiquement tous les modules livrés par le paquet Debian,
; puis on force explicitement les 3 modules AudioSocket au cas où l'auto-
; load ne les prendrait pas (config défensive).
[modules]
autoload=yes

load => app_audiosocket.so
load => chan_audiosocket.so
load => res_audiosocket.so

; Modules dont on n'a pas besoin pour un POC minimal (économisent quelques Mo).
noload => chan_iax2.so
noload => cdr_odbc.so
noload => cdr_pgsql.so
noload => cdr_mysql.so
; cdr_csv inonde les logs d'erreurs (répertoire cdr-csv absent de l'image)
; et le POC n'exploite pas les CDR — la journalisation métier passe par
; le CallLogPort côté bot.
noload => cdr_csv.so
