; Dialplan minimal pour le POC Hikky.
;
; Deux extensions utilisables depuis le softphone (Zoiper enregistré sur 1000) :
;
;   *43   : echo test Asterisk natif (tu parles, tu t'entends). Sert à
;           valider que l'audio SIP fait bien l'aller-retour softphone
;           ↔ Asterisk, sans passer par le bot.
;
;   2000  : appel du bot IA Hikky via AudioSocket. Asterisk ouvre une
;           connexion TCP vers __BOT_HOST__:__BOT_PORT__ (défauts =
;           host.docker.internal:6666), envoie le UUID du canal comme
;           call_id puis stream l'audio 8 kHz mono en μ-law.

[globals]

[general]
static=yes
writeprotect=no
autofallthrough=yes

[from-internal]

; ─────────────────────── Echo test (Asterisk built-in) ───────────────────────
exten => *43,1,NoOp(Asterisk echo test)
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

; ────────────────────────── Bot IA via AudioSocket ──────────────────────────
; AudioSocket() exige un UUID valide en premier argument.
;
; `${CHANNEL(uuid)}` n'existe PAS dans Asterisk 22 : la fonction échoue
; (-1) et renvoie une chaîne vide, ce qui fait rejeter l'appel avec
; "UUID is required". On dérive donc un UUID déterministe du MD5 de
; ${UNIQUEID}, découpé au format 8-4-4-4-12. Unique par appel, sans
; dépendance à SHELL() ni à uuidgen.
exten => 2000,1,NoOp(Bot Hikky IA via AudioSocket -> __BOT_HOST__:__BOT_PORT__)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(H=${MD5(${UNIQUEID})})
 same => n,Set(CALLUUID=${H:0:8}-${H:8:4}-${H:12:4}-${H:16:4}-${H:20:12})
 same => n,NoOp(UUID appel: ${CALLUUID})
 same => n,AudioSocket(${CALLUUID},__BOT_HOST__:__BOT_PORT__)
 same => n,Hangup()

; ────────────────────────── Rappel des règles ──────────────────────────
; Toute autre extension composée : message d'erreur, raccroche.
exten => _X.,1,NoOp(Extension inconnue: ${EXTEN})
 same => n,Playback(pbx-invalid)
 same => n,Hangup()
