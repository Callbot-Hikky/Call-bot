# Stack Asterisk pour le serveur d'appel Hikky (Scaleway, Debian/Ubuntu x86_64).
#
# Remplace le Raspberry Pi : l'Asterisk tourne ici sur le serveur qui héberge
# déjà le front/back. Le bot IA, lui, tourne sur un pod GPU RunPod ; Asterisk
# le joint via un tunnel SSH local (systemd hikky-bot-tunnel) sur 127.0.0.1:6666.
#
#  - network_mode host : indispensable sous Linux pour le SIP/RTP (le NAT
#    interne de Docker casserait le média). Le serveur a son IP publique
#    directement sur l'interface, donc Asterisk annonce la bonne adresse.
#
#  - BOT_HOST=127.0.0.1 : extrémité locale du tunnel SSH vers le pod.
#
#  - SIP_EXTENSION_PASSWORD : le SIP est exposé sur internet (softphone
#    Zoiper), le mot de passe DOIT être fort — fourni via .env, jamais figé.
#
# Lancement :
#     cd /opt/hikky-asterisk/docker
#     docker compose -f docker-compose.server.yml up --build -d

services:
  asterisk:
    build:
      context: ./asterisk
    image: hikky/asterisk:server
    container_name: hikky-asterisk
    restart: unless-stopped

    network_mode: host

    environment:
      BOT_HOST: ${BOT_HOST:-127.0.0.1}
      BOT_PORT: ${BOT_PORT:-6666}
      SIP_EXTENSION_PASSWORD: ${SIP_EXTENSION_PASSWORD:?SIP_EXTENSION_PASSWORD requis}

    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
