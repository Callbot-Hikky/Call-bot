# Stack Asterisk pour Raspberry Pi 5 (Linux ARM64).
#
# Différences avec docker-compose.yml (Docker Desktop Mac) :
#
#  - `network_mode: host` : sous Linux, le NAT interne de Docker casse le
#    SIP/RTP (Asterisk annoncerait son IP privée 172.x dans le SDP, et le
#    softphone tenterait d'y envoyer l'audio). En mode host, Asterisk voit
#    directement l'interface du Pi. C'est la config standard d'un PBX.
#
#  - Pas de section `ports:` : incompatible avec network_mode host, et
#    inutile puisque tous les ports sont déjà exposés.
#
#  - `host.docker.internal` n'existe pas en mode host : BOT_HOST doit être
#    une adresse joignable depuis le Pi. Pour un bot sur RunPod, on ouvre
#    un tunnel SSH sur le Pi et on pointe sur 127.0.0.1.
#
# Lancement :
#     cd docker && docker compose -f docker-compose.pi.yml up --build
#
# Zoiper se configure sur l'IP LAN du Pi (ex. 192.168.1.42), extension 1000,
# mot de passe = SIP_EXTENSION_PASSWORD. Composer *43 pour l'echo test,
# 2000 pour appeler le bot.

services:
  asterisk:
    build:
      context: ./asterisk
    image: hikky/asterisk:pi
    container_name: hikky-asterisk
    restart: unless-stopped

    network_mode: host

    environment:
      # 127.0.0.1 = extrémité locale du tunnel SSH vers RunPod, ouvert par
      # le service systemd hikky-tunnel (cf. docker/pi/README.md).
      BOT_HOST: ${BOT_HOST:-127.0.0.1}
      BOT_PORT: ${BOT_PORT:-6666}
      # À CHANGER si le SIP devient joignable hors du réseau local.
      SIP_EXTENSION_PASSWORD: ${SIP_EXTENSION_PASSWORD:-1000}

    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
